services:
  ollama:
    image: ollama/ollama:latest
    container_name: zocoia-ollama
    restart: always
    volumes:
      - ./ollama:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  zoco-browser:
    image: browserless/chrome:latest
    container_name: zocoia-browser
    restart: always
    expose:
      - "3000"
    environment:
      - TOKEN=${ZOCO_BROWSER_TOKEN}
      - MAX_CONCURRENT_SESSIONS=1
      - CONNECTION_TIMEOUT=600000
      - PREBOOT_CHROME=true
    shm_size: "1gb"
    networks:
      - zocoia_browser_egress
      - zocoia_control

  zocoia-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "3001"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=3001
      - NODE_ENV=production
      - ADMIN_KEY=${ADMIN_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/app.db
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-local-ollama}
      - OLLAMA_MODEL_FLASH=${OLLAMA_MODEL_FLASH:-qwen2.5-coder:3b}
      - OLLAMA_MODEL_PLUS=${OLLAMA_MODEL_PLUS:-qwen2.5-coder:3b}
      - OLLAMA_MODEL_MAX=${OLLAMA_MODEL_MAX:-qwen2.5-coder:3b}
      - OLLAMA_MODEL_LAB=${OLLAMA_MODEL_LAB:-qwen2.5-coder:3b}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-300000}
      - NEOBANCO_BACKEND_URL=http://neobanco-preview:8000
      - ALLOWED_ORIGINS=https://zocoia.es,https://www.zocoia.es,https://marisai.es,https://www.marisai.es
      - SANDBOX_RUNNER_URL=http://zocoia-sandbox-runner:8080
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN}
      - ZOCO_BROWSER_PROVIDER=local
      - ZOCO_BROWSER_WS_ENDPOINT=ws://zoco-browser:3000
      - ZOCO_BROWSER_TOKEN=${ZOCO_BROWSER_TOKEN}
    depends_on:
      ollama:
        condition: service_healthy
      zoco-browser:
        condition: service_started
    restart: always
    volumes:
      - ./data:/data
    networks:
      - default
      - zocoia_control
      - zocoia_internal

networks:
  default:
    name: maris-ai_default
    external: true
  zocoia_control:
    external: true
    name: zocoia_control
  zocoia_internal:
    external: true
    name: zocoia_internal
  zocoia_browser_egress:
    name: zocoia_browser_egress
    driver: bridge
